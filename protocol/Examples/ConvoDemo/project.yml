name: ConvoDemo
options:
  bundleIdPrefix: com.LoganShire
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
packages:
  convo_protocol:
    path: ../..
targets:
  ConvoDemo:
    type: application
    platform: [iOS, macOS]
    sources: [Sources]
    dependencies:
      - package: convo_protocol
        product: ConvoClient
      - package: convo_protocol
        product: ConvoWebRTC
      - package: convo_protocol
        product: ConvoCalling
    info:
      path: Info.plist
      properties:
        NSMicrophoneUsageDescription: The demo sends your voice on a call.
        NSCameraUsageDescription: The demo sends your camera on a video call.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_NAME: ConvoDemo
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
