# P2PRC's CI, as the Playground's (AttilaTheFun/playground's build.yml), by
# the owner's policy for public repositories (AttilaTheFun/reviews'
# docs/CI_POLICY.md: tests without a GUI before a merge, builds after one,
# the GUI tests by hand; the proof only ahead of a release, run: release or
# run: proof by hand), on GitHub's own standard runners alone: the web and
# Android together, one job and one Bazel output base, in Swift's image (by
# digest) on x86_64 Ubuntu (Android's SDK tools are x86_64), with the job's
# tools added (tools/ci/job_tools.sh), and the protocol's tests (SwiftPM,
# tools/ci/protocol_test.sh) beside them. The Apple targets on Nimbus'
# runners (the owner, 2026-11-27: no paid GitHub runners): built on Linux
# with rules_applecross (Xcode 27.2's SDK archive from Nimbus' files, which
# serves it to its own machines alone: Apple's SDKs may not be
# redistributed; CI_NIMBUS=1 tools/ci/ci_bazel.sh setup), Nimbus' cache
# theirs, and the proof on a macOS VM a Nimbus runner leases
# (tools/ci/proof_on_vm.sh). A fork's pull request never reaches Nimbus'
# runners, and no Apple job runs for one. The GitHub jobs' Bazel
# caches are GitHub's (.github/actions/bazel_cache), written by main's
# builds alone, and BuildBuddy's remote cache, its key the
# BUILDBUDDY_API_KEY secret, handed to the cache action's setup alone, in
# every job, before a merge and after (tools/ci/ci_bazel.sh: each reads and
# writes, a pull request's and a branch's runs in an instance of their own,
# so the signed builds read reviewed code's results alone; main's push
# builds and the release jobs download every output). A fork's pull
# request, which GitHub gives no secrets, builds on GitHub's cache alone.
#
# - pull requests: container (the web and Android apps, CI's tools, and the
#   protocol's tests): the required check. A newer push cancels its run.
#   The Apple apps aren't built for a pull request (the owner's rule for
#   public repositories, 2026-11-13): they're built nightly on Nimbus
#   (populate-apple, which opens an issue when main's are broken), by hand
#   (`run: verify`) and at release (verify-apple, alpha-apple).
# - main's commits: populate (the web and Android, and what a release
#   builds, into the caches; never a proof). The Apple apps' populate-apple
#   runs nightly (schedule, 06:00Z) or by hand (`run: populate`), not on
#   every push, writing Nimbus' cache.
# - by hand (`run:`): verify (the builds and the protocol's tests, no
#   proof: verify, verify-apple); proof (the end-to-end run alone, on a
#   macOS VM leased from Nimbus: two simulators open the web client in Safari, pair and
#   message through the live nodes, their link relayed by Cloudflare's TURN
#   (tools/ci/e2e_proof.sh, tools/e2e/run_pair.sh), written in Reviews'
#   format 2 by `convo_ci proof`, which judges the run by what happened;
#   uploaded as the `proof` artifact and attached to a release's draft as
#   proof.zip; on a commit of main, or, to bisect a regression, on a branch
#   pushed at an earlier one); prerelease (main: the Alphas, alpha-apple
#   and alpha, signed with the `release` environment's keys and drafted,
#   build_tools' `sign`); release (main: verify's jobs and the proof, then
#   the Alphas and a draft proposed for release; the one run that proves and
#   verifies at once, which tools/ci/verified.sh asks for). Drafts are CI's:
#   no agent publishes one or makes a tag.
# - a published release (its v* tag, made in Reviews): verified
#   (tools/ci/verified.sh), the proposal's Alphas checked by their own
#   signatures (`convo_ci verify-alphas`), the Apple Alphas stamped
#   Production and signed again (nothing Apple rebuilt), Android's built for
#   production and signed, the assets attached (release): the signed builds
#   (the iPhone's, the Mac's with its disk image, Android's, and
#   builds.json, which Applications reads) and SHA256SUMS, beside the
#   proposal's web client and proof.zip. pages.yml deploys the web client
#   to p2prc.org. A pre-release is never released so.
# The signing keys reach only the alpha and release jobs' signing steps, on
# GitHub's runners: no secret reaches Nimbus' runners or VMs. The
# distribution's settings (the team, UpdateKit's app group and the
# Applications bundle ids, the shared GitHub sign-in: P2PRC_* secrets) are
# never built in: alpha-apple builds the Alphas without them, and alpha's
# signing step stamps them into each app's Info.plist and entitlements as
# `sign apple` signs it (build_tools' --add-infoplist and --add-groups,
# files of the step's own; build_tools#18), the team the release job's check
# too; never a pull request's build.
name: Build
on:
  push:
    # main's commits: populate.
    branches: [main]
  pull_request:
  release:
    types: [published]
  # populate-apple: the Apple apps into Nimbus' cache, nightly.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "What to run: verify (the builds and tests, no proof), prerelease or release on main (verify on a branch to bisect); proof (the end-to-end proof alone); populate (the Apple apps into the caches, as the nightly run)"
        type: choice
        options: [verify, proof, prerelease, release, populate]
        default: verify
# A pull request's newer push (a rebase, an update with main) cancels its
# branch's older run, whose result no longer counts. Every other run
# (populate, a run by hand, a release) is a group of its own and never
# cancelled, so a publish is never cut off halfway.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.head_ref) || format('build-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# What the publishing jobs build (flags as --name=value): the iPhone and
# iPad app (a device build, signed ad hoc with a placeholder profile by
# --config=ci_device, which build_tools' `sign apple` signs again with the
# bundle id's own) and the Mac app, both optimized, on Linux; Android's (its
# isomer_android_app's _apk) on Linux; the web client zipped by
# tools/ci/package_web.sh. DISTRIBUTION_SETTINGS names the settings the
# Alphas carry, their values the step's environment's (alpha-apple).
# The Android release key's name and its certificate's SHA-256, pinned
# (build_tools' `sign android`): empty until P2PRC's key exists, the APK is
# left unsigned and unattached, with a warning, and no release can be
# promoted (a release refuses to go out without Android's app).
env:
  PUBLISHED_APPLE: >-
    --config=ci_device --compilation_mode=opt
    //applications/p2prc_ios:p2prc_ios
    //applications/p2prc_macos:p2prc_macos
  PUBLISHED_LINUX: >-
    --compilation_mode=opt
    //applications/p2prc_android:p2prc_android_apk
  # Built in: where Shireworks Kit files reports (this repository's name,
  # no secret). The rest of the distribution's settings are stamped at
  # signing (alpha).
  DISTRIBUTION_SETTINGS: >-
    --repo_env=P2PRC_SHIREWORKS_REPOSITORY
  # The apps P2PRC's builds replace (builds.json's `replaces`): Convo's,
  # on each platform.
  REPLACES: >-
    --map com.LoganShire.P2PRC=com.LoganShire.Convo
    --map com.loganshire.p2prc=com.loganshire.convo
  ANDROID_KEY: p2prc
  # Empty until P2PRC's Android release key exists: fill in its
  # certificate's SHA-256 (alpha's warning names it once the key is set).
  ANDROID_PIN: "299886501ea68dedeefe8efc4f66323d821862d46b069a1c678fa84146c823d3"

jobs:
  # --- Pull requests: every platform built, the protocol's tests ----------

  # The web and Android in one job, one Bazel output base on the runner's
  # second disk: Swift's image on x86_64 (Android's SDK tools are x86_64).
  container:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      # Bazel's tree on the runner's second disk (ISOMER_BAZEL_ROOT).
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 180
    env:
      ISOMER_PLATFORMS: web android
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Every app and CI's tools built
        env:
          ISOMER_EXECUTION_LOGS: ${{ runner.temp }}/execution-logs
        run: exec tools/ci/container_build.sh pr
      # The protocol's own tests (SwiftPM), whatever came of the build.
      - name: The protocol's tests
        if: ${{ !cancelled() }}
        run: exec tools/ci/protocol_test.sh
      # What each invocation ran, to find what the cache misses.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: execution-logs
          path: ${{ runner.temp }}/execution-logs
          retention-days: 1

  # --- main: the merged tree built into the caches ------------------------

  populate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 180
    env:
      ISOMER_PLATFORMS: web android
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - id: cache
        uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: The merged tree, built into the cache
        env:
          ISOMER_EXECUTION_LOGS: ${{ runner.temp }}/execution-logs
        run: exec tools/ci/container_build.sh all
      # And what a release builds here: the Android app and the web client
      # as alpha builds them.
      - name: The published Android app, built into the cache
        run: exec tools/ci/container_build.sh package .ci/packages $PUBLISHED_LINUX
      - name: The published web client, built into the cache
        run: exec tools/ci/package_web.sh .ci/web.zip --compilation_mode=opt
      # The web and Android's share of GitHub's 10 GB.
      - uses: ./.github/actions/bazel_cache_save
        if: ${{ !cancelled() }}
        with:
          group: ubuntu
          gigabytes: 6
          repository-hit: ${{ steps.cache.outputs.repository-hit }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: execution-logs
          path: ${{ runner.temp }}/execution-logs
          retention-days: 1

  # On a Nimbus runner, on Linux (rules_applecross), writing Nimbus' cache
  # (`nimbus job cache-write`, by the job's OIDC token: main's alone).
  populate-apple:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run == 'populate' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, p2prc-jit]
    timeout-minutes: 180
    # No write token on a Nimbus runner: a broken main's issue is
    # populate-apple-report's, on GitHub's runner.
    permissions:
      contents: read
      # Nimbus' cache, written by this job (cache-write).
      id-token: write
    env:
      ISOMER_PLATFORMS: apple
      CI_NIMBUS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - name: Nimbus' cache, written by this job
        run: for i in 1 2 3 4 5 6 7 8 9; do /opt/nimbus/bin/nimbus job cache-write && exit 0; sleep 10; done; exit 1
      - name: Bazel's settings
        run: tools/ci/ci_bazel.sh setup
      - name: The merged tree's Apple apps, built into the cache
        run: exec tools/ci/container_build.sh all
      # Without the distribution's settings (alpha-apple's own): what of
      # the Alphas doesn't depend on them.
      - name: The published Apple apps, built into the cache
        run: exec tools/ci/container_build.sh package .ci/packages $PUBLISHED_APPLE


  # A broken main, seen at night (populate-apple failed on schedule): an
  # issue says so, with the run (one issue, commented on again while it
  # stays open). On GitHub's runner, which alone holds the token that writes
  # issues: no write token reaches a Nimbus runner.
  populate-apple-report:
    needs: populate-apple
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: A broken main, reported
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          . tools/ci/gh_ready.sh
          title="Nightly Apple build failed on main"
          body="The nightly Apple build (populate-apple) failed on main at $GITHUB_SHA: $RUN_URL"
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          if [ -n "$open" ]; then gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi

  # --- By hand: verify (the builds and the tests, no proof) ---------------

  verify:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 180
    env:
      ISOMER_PLATFORMS: web android
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Build
        run: exec tools/ci/container_build.sh
      - name: The protocol's tests
        if: ${{ !cancelled() }}
        run: exec tools/ci/protocol_test.sh

  # On a Nimbus runner, on Linux (rules_applecross), reading Nimbus' cache.
  verify-apple:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: [self-hosted, p2prc-jit]
    timeout-minutes: 180
    env:
      ISOMER_PLATFORMS: apple
      CI_NIMBUS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - name: Bazel's settings
        run: tools/ci/ci_bazel.sh setup
      - name: Build, on Linux with rules_applecross
        run: exec tools/ci/container_build.sh

  # --- By hand: the proof ---------------------------------------------------

  # The end-to-end run on a macOS VM a Nimbus runner leases
  # (tools/ci/proof_on_vm.sh: xcode_27_2, an hour, renewed, released however
  # the job ends; no secret goes to it): two simulators made for the run,
  # the web client in Safari, the live
  # nodes, relay only; written in Reviews' format 2 whatever came of it (a
  # failed run is what the proof is for), the job failing with it. The job
  # keeps its name, which tools/ci/verified.sh and alpha-apple ask for.
  proof:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'release' || inputs.run == 'proof')
    # The small runner: it only leases the VM and copies files.
    runs-on: [self-hosted, p2prc-jit-small]
    concurrency:
      group: p2prc-proof-${{ github.ref }}
      cancel-in-progress: false
    # The VM can wait for room (Nimbus lends two at a time).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: Two clients paired and messaging through the nodes, relayed
        run: exec tools/ci/proof_on_vm.sh "$RUNNER_TEMP/proof" "$RUNNER_TEMP/e2e"
      # The run's `proof`, which Reviews reads (and a release's draft carries
      # as proof.zip besides): kept as isomer keeps its own; every other
      # artifact for a day.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof
          path: ${{ runner.temp }}/proof
          retention-days: 90
      # The run's own files (the page's beacons, the commands), to see why.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-out
          path: |
            tools/e2e/out
            !tools/e2e/out/site
          retention-days: 1

  # --- By hand on main: a proposal (prerelease, or release once verified) -

  # The proposal's version, MAJOR.MINOR.N, from the repository's releases
  # (tools/ci/version_from_tags.sh: the same again for the same commit), on
  # GitHub's runner: listing the drafts it counts takes `contents: write`,
  # which no Nimbus runner holds. alpha-apple and alpha stamp it.
  version:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.run == 'prerelease' || inputs.run == 'release')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The releases' drafts, which the version is counted from.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/ci/version_from_tags.sh applications/p2prc_ios/Info.plist applications/p2prc_macos/Info.plist
          version="$(awk '/<key>CFBundleShortVersionString<\/key>/ { found = 1 }
              found && match($0, /<string>[^<]*<\/string>/) { print substr($0, RSTART + 8, RLENGTH - 17); exit }' applications/p2prc_ios/Info.plist)"
          echo "version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  alpha-apple:
    # The Apple Alphas, built unsigned (alpha signs them), without the
    # distribution's settings (alpha stamps them), at the version job's
    # version, handed on to alpha.
    needs: [verify, verify-apple, proof, version]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      needs.version.result == 'success' &&
      (inputs.run == 'prerelease' || (inputs.run == 'release' &&
      needs.verify.result == 'success' && needs.verify-apple.result == 'success' &&
      needs.proof.result == 'success'))
    # On a Nimbus runner, on Linux (rules_applecross), reading Nimbus' cache.
    runs-on: [self-hosted, p2prc-jit]
    # Not the release environment: no secret reaches a Nimbus runner.
    timeout-minutes: 180
    # Read-only: no write token on a Nimbus runner.
    permissions:
      contents: read
    outputs:
      version: ${{ needs.version.outputs.version }}
    env:
      ISOMER_PLATFORMS: apple
      CI_NIMBUS: "1"
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - name: Bazel's settings
        run: tools/ci/ci_bazel.sh setup
      # The version job's version and the commit, stamped into the checkout
      # before the build (tools/ci/stamp_apps.sh, convo_ci), never committed.
      - name: Version
        run: tools/ci/stamp_apps.sh "$VERSION"
      # exec: the runner's cancel reaches the build. No secret here (a
      # Nimbus runner): the settings are stamped at signing (alpha).
      - name: Build
        env:
          # Where Shireworks Kit files the app's crash and bug reports: this repository.
          P2PRC_SHIREWORKS_REPOSITORY: ${{ github.repository }}
        run: exec tools/ci/container_build.sh package .ci/packages $DISTRIBUTION_SETTINGS $PUBLISHED_APPLE
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-apple
          path: |
            .ci/packages/*.ipa
            .ci/packages/*.zip
          retention-days: 1
          if-no-files-found: error

  alpha:
    # The proposal: Android's Alpha and the web client built, every build
    # signed (build_tools' `sign`: a platform whose keys aren't set is
    # skipped, saying so), the draft made and the builds attached
    # (tools/ci/draft_release.sh, attach_release.sh: P2PRC-<version>-ios.ipa,
    # -macos.zip, -android.apk, -web.zip, SHA256SUMS and builds.json, which
    # Applications lists), and a release's proof with them (proof.zip).
    needs: alpha-apple
    if: ${{ !cancelled() && needs.alpha-apple.result == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    environment: release
    timeout-minutes: 180
    permissions:
      # The draft release.
      contents: write
      # This run's proof artifact.
      actions: read
    env:
      ISOMER_PLATFORMS: web android
      ISOMER_BAZEL_ROOT: /mnt/bazel
      VERSION: ${{ needs.alpha-apple.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The draft's changes since the previous release.
          fetch-depth: 0
      - name: The job's tools
        run: tools/ci/job_tools.sh
      # The owner's line rule: no proposal on a line that already has a
      # published release (tools/ci/check_version_line.sh), before anything
      # is built.
      - name: The version's line is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/check_version_line.sh "$VERSION"
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Version
        run: tools/ci/stamp_apps.sh "$VERSION"
      # exec: the runner's cancel reaches the build.
      - name: Build
        run: exec tools/ci/container_build.sh package .ci/packages $PUBLISHED_LINUX
      # The web client the release carries, which pages.yml deploys when it's
      # published, stamped with the version above.
      - name: The web client
        run: tools/ci/package_web.sh "$RUNNER_TEMP/assets/P2PRC-$VERSION-web.zip" --compilation_mode=opt
      - uses: actions/download-artifact@v4
        with:
          name: alpha-apple
          path: .ci/packages
      # Nothing is published if the Mac app's icon has no dark appearance.
      - name: The icon's dark appearance
        run: tools/ci/check_mac_icons.sh .ci/packages
      # build_tools' `sign` and what it runs (//tools/ci_tools), built in a
      # step with no key in its environment (build_tools' README: Bazel's
      # server and build events see its client's environment), their paths
      # handed to the signing steps, which run `sign` directly.
      - name: The signing tools
        shell: bash
        run: |
          bazel build //tools/ci_tools:all //tools/convo_ci
          base="$(bazel info output_base)" root="$(bazel info execution_root)"
          for tool in sign rcodesign dmg java apksigner aapt2; do
            path="$(bazel cquery --output=files "//tools/ci_tools:$tool" | head -1)"
            [ -n "$path" ] || { echo "::error::no $tool"; exit 1; }
            case "$path" in external/*) path="$base/$path" ;; *) path="$root/$path" ;; esac
            echo "BUILD_TOOLS_${tool^^}=$path" >> "$GITHUB_ENV"
          done
          echo "CONVO_CI=$root/$(bazel cquery --output=files //tools/convo_ci | head -1)" >> "$GITHUB_ENV"
      # The keys reach these steps alone, each its own platform's. The Apple
      # apps, named <App>-<version>-<platform>.<ext>, each line of
      # builds.json written (the Mac's icon beside it); the iPhone's with
      # its development profile (the one identity P2PRC has for it, which
      # `convo_ci verify-alphas` expects). A platform whose keys aren't set
      # is skipped, saying so in the summary.
      # The distribution's settings (alpha-apple built the Alphas without
      # them, on Nimbus), stamped into each app's Info.plist and
      # entitlements as it is signed (build_tools#18): every one set, or the
      # Alphas would carry no UpdateKit or shared sign-in; each masked
      # besides GitHub's own masking of secrets (the team shows inside the
      # keychain group's name); the Info.plist keys in a file of the job's
      # own (mode 600), deleted after, never printed.
      - name: Sign the Apple apps
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
          APPLE_PROFILES: ${{ secrets.APPLE_PROFILES }}
          P2PRC_TEAM_ID: ${{ secrets.P2PRC_TEAM_ID }}
          P2PRC_APP_GROUP: ${{ secrets.P2PRC_APP_GROUP }}
          P2PRC_APPLICATIONS_BUNDLE_IDS: ${{ secrets.P2PRC_APPLICATIONS_BUNDLE_IDS }}
          P2PRC_SHARED_CLIENT_ID: ${{ secrets.P2PRC_SHARED_CLIENT_ID }}
          P2PRC_SHARED_SERVICE: ${{ secrets.P2PRC_SHARED_SERVICE }}
        shell: bash
        run: |
          set -euo pipefail
          for name in P2PRC_TEAM_ID P2PRC_APP_GROUP P2PRC_APPLICATIONS_BUNDLE_IDS P2PRC_SHARED_CLIENT_ID P2PRC_SHARED_SERVICE; do
            value="$(printenv "$name" || true)"
            [ -n "$value" ] || { echo "::error::$name is not set: the Alphas would carry no UpdateKit or shared sign-in"; exit 1; }
            echo "::add-mask::$value"
          done
          plist="$(mktemp)" groups="$(mktemp)"; chmod 600 "$plist" "$groups"; trap 'rm -f "$plist" "$groups"' EXIT
          python3 -I -c 'import json, os, sys
          env = os.environ
          json.dump({"app": [env["P2PRC_APP_GROUP"]], "keychain": [env["P2PRC_TEAM_ID"] + "." + env["P2PRC_SHARED_SERVICE"]]},
                    open(sys.argv[2], "w"))
          json.dump({
              "GitHubSharedClientID": env["P2PRC_SHARED_CLIENT_ID"],
              "GitHubSharedKeychainGroup": env["P2PRC_TEAM_ID"] + "." + env["P2PRC_SHARED_SERVICE"],
              "GitHubSharedLockGroup": env["P2PRC_APP_GROUP"],
              "GitHubSharedKeychainService": env["P2PRC_SHARED_SERVICE"],
              "UpdateKitAppGroup": env["P2PRC_APP_GROUP"],
              "UpdateKitApplicationsBundleIDs": [i.strip() for i in env["P2PRC_APPLICATIONS_BUNDLE_IDS"].split(",") if i.strip()],
          }, open(sys.argv[1], "w"))' "$plist" "$groups"
          "$BUILD_TOOLS_SIGN" apple --key-from-env --rcodesign "$BUILD_TOOLS_RCODESIGN" \
            --app P2PRC --ipa-kind development --skip-missing-keys \
            --add-infoplist "$plist" --add-groups "$groups" \
            --builds "$RUNNER_TEMP/assets/builds.json" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/assets" \
            .ci/packages/*.ipa .ci/packages/*.zip
      # Android's: its release key, its certificate pinned (ANDROID_PIN),
      # named <App>-<versionName>-android.apk; skipped, saying so in the
      # summary, when the key isn't set. With no pin yet, nothing is signed:
      # the warning names the key's certificate, when the key is set, to pin.
      - name: Sign the Android app
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$ANDROID_PIN" ]; then
            [ -z "$ANDROID_SIGNING_KEYSTORE" ] || "$BUILD_TOOLS_SIGN" android --key-from-env --app "$ANDROID_KEY" --pin "$(printf '0%.0s' $(seq 64))" \
              --java "$BUILD_TOOLS_JAVA" --apksigner "$BUILD_TOOLS_APKSIGNER" .ci/packages/*.apk "$RUNNER_TEMP/probe.apk" 2>&1 | grep -o 'its certificate is [0-9a-fA-F:]*' || true
            echo "::warning::ANDROID_PIN is empty: Android's Alpha is not signed or attached. Pin the release key's certificate (named above, once ANDROID_SIGNING_KEYSTORE is set) in build.yml."
            exit 0
          fi
          "$BUILD_TOOLS_SIGN" android --key-from-env --app "$ANDROID_KEY" --pin "$ANDROID_PIN" \
            --java "$BUILD_TOOLS_JAVA" --apksigner "$BUILD_TOOLS_APKSIGNER" --aapt2 "$BUILD_TOOLS_AAPT2" \
            --name P2PRC --variant Alpha --skip-missing-keys \
            --out "$RUNNER_TEMP/assets" --builds "$RUNNER_TEMP/assets/builds.json" --commit "$GITHUB_SHA" \
            .ci/packages/*.apk
      # A release's proof (this run's `proof`, Reviews' format 2), zipped
      # among the draft's assets as proof.zip: the release keeps it, and
      # Reviews compares the next release's with it.
      - uses: actions/download-artifact@v4
        if: inputs.run == 'release'
        with:
          name: proof
          path: ${{ runner.temp }}/proof
      - name: The proof, among the assets
        if: inputs.run == 'release'
        run: tools/ci/proof_zip.sh "$RUNNER_TEMP/proof" "$RUNNER_TEMP/assets/proof.zip"
      # What each build replaces, on its builds.json line, so Shireworks'
      # Applications offers P2PRC to whoever has Convo installed (convo_ci
      # replaces; after signing, which writes the lines).
      - name: What the builds replace
        run: >-
          "$CONVO_CI" replaces --builds "$RUNNER_TEMP/assets/builds.json" $REPLACES
      - name: The checksums
        run: tools/ci/checksums.sh "$RUNNER_TEMP/assets"
      - name: The draft release, its builds attached
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.run }}
        run: |
          tools/ci/draft_release.sh "$VERSION" "$KIND"
          tools/ci/attach_release.sh "v$VERSION" "$RUNNER_TEMP/assets"

  # --- A published release: nothing Apple rebuilt -----------------------

  release:
    # When the owner publishes a GitHub release (its v0.1.N tag on a main
    # commit, whose proof is in): the proposal's Alphas (the builds the
    # owner tested) checked by their own signatures (`convo_ci
    # verify-alphas`: Apple's root, the team, the bundle id, the version,
    # the commit; Android's pinned certificate), the iPhone's and the Mac's
    # stamped Production and signed again (tools/ci/release_alphas.sh,
    # `sign apple --variant Production`; the Mac's with its disk image),
    # Android's built for production and signed, and the signed builds
    # attached in place of the Alphas (tools/ci/attach_release.sh), with
    # the release's SHA256SUMS.
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    environment: release
    timeout-minutes: 120
    permissions:
      # The release's assets.
      contents: write
      # Its commit's verify run.
      actions: read
    env:
      ISOMER_PLATFORMS: web android
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      # The tag's commit, with main's history beside it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The job's tools
        run: tools/ci/job_tools.sh
      # A release is a main commit: a tag whose commit isn't on main stops here.
      - name: The release is a main commit
        run: git merge-base --is-ancestor HEAD origin/main || { echo "::error::$GITHUB_REF_NAME's commit is not on main"; exit 1; }
      # No release of a commit not verified (its verify and proof passed, in a
      # run by hand): checked before anything is signed.
      - name: The commit was verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/verified.sh "$GITHUB_SHA"
      # Android's is promoted only with its key's pin in place: a release
      # never goes out without Android's app.
      - name: Android's key is pinned
        run: |
          test -n "$ANDROID_PIN" || { echo "::error::ANDROID_PIN is empty: pin P2PRC's Android release key in build.yml before releasing"; exit 1; }
      - name: The proposal's Alphas
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/release_alphas.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/alphas"
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      # Android's build: the version of this commit's release
      # (tools/ci/version_from_tags.sh finds it by its commit).
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/stamp_apps.sh
      - name: Android's, for production
        run: exec tools/ci/container_build.sh package .ci/android $PUBLISHED_LINUX
      # build_tools' `sign` and what it runs (//tools/ci_tools), and
      # convo_ci, built in a step with no key in its environment (build_tools'
      # README: Bazel's server and build events see its client's
      # environment), their paths handed to the steps that run them.
      - name: The signing tools
        shell: bash
        run: |
          bazel build //tools/ci_tools:all //tools/convo_ci
          base="$(bazel info output_base)" root="$(bazel info execution_root)"
          for tool in sign rcodesign dmg java apksigner aapt2; do
            path="$(bazel cquery --output=files "//tools/ci_tools:$tool" | head -1)"
            [ -n "$path" ] || { echo "::error::no $tool"; exit 1; }
            case "$path" in external/*) path="$base/$path" ;; *) path="$root/$path" ;; esac
            echo "BUILD_TOOLS_${tool^^}=$path" >> "$GITHUB_ENV"
          done
          echo "CONVO_CI=$root/$(bazel cquery --output=files //tools/convo_ci | head -1)" >> "$GITHUB_ENV"
      # Nothing the draft says is trusted: each Alpha by its own signature
      # (only the alpha job holds the keys that make one), its team, bundle
      # id, version and commit the release's (convo_ci verify-alphas).
      - name: The Alphas are CI's own
        env:
          P2PRC_TEAM_ID: ${{ secrets.P2PRC_TEAM_ID }}
        run: >-
          "$CONVO_CI" verify-alphas --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA"
          --team "$P2PRC_TEAM_ID" --pin "$ANDROID_PIN" --apple-root tools/ci/AppleIncRootCertificate.cer
          --rcodesign "$BUILD_TOOLS_RCODESIGN" --java "$BUILD_TOOLS_JAVA"
          --apksigner "$BUILD_TOOLS_APKSIGNER" --aapt2 "$BUILD_TOOLS_AAPT2"
          "$RUNNER_TEMP"/alphas/*
      # The keys reach these steps alone, each its own platform's.
      # Production: each Apple app's BuildVariant made Production as it is
      # signed again (the proposal's tested Alphas promoted), the Mac's disk
      # image beside it. A key not set fails the release, never publishing
      # it without that platform's app.
      - name: Sign the Apple apps
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
          APPLE_PROFILES: ${{ secrets.APPLE_PROFILES }}
        run: >-
          "$BUILD_TOOLS_SIGN" apple --key-from-env --rcodesign "$BUILD_TOOLS_RCODESIGN"
          --app P2PRC --ipa-kind development
          --variant Production --dmg "$BUILD_TOOLS_DMG"
          --builds "$RUNNER_TEMP/assets/builds.json" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/assets"
          "$RUNNER_TEMP"/alphas/*.ipa "$RUNNER_TEMP"/alphas/*.zip
      # Android's: its release key, its certificate pinned (ANDROID_PIN),
      # named <App>-<versionName>-android.apk; a key not set fails the release.
      - name: Sign the Android app
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: >-
          "$BUILD_TOOLS_SIGN" android --key-from-env --app "$ANDROID_KEY" --pin "$ANDROID_PIN"
          --java "$BUILD_TOOLS_JAVA" --apksigner "$BUILD_TOOLS_APKSIGNER" --aapt2 "$BUILD_TOOLS_AAPT2"
          --name P2PRC --variant Production
          --out "$RUNNER_TEMP/assets" --builds "$RUNNER_TEMP/assets/builds.json" --commit "$GITHUB_SHA"
          .ci/android/*.apk
      # What each build replaces, on its builds.json line, so Shireworks'
      # Applications offers P2PRC to whoever has Convo installed (convo_ci
      # replaces; after signing, which writes the lines).
      - name: What the builds replace
        run: >-
          "$CONVO_CI" replaces --builds "$RUNNER_TEMP/assets/builds.json" $REPLACES
      # The release's checksums: its signed builds and the web client its
      # proposal attached.
      - name: The checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . tools/ci/gh_ready.sh
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'P2PRC-*-web.zip' --dir "$RUNNER_TEMP/web"
          tools/ci/checksums.sh "$RUNNER_TEMP/assets" "$RUNNER_TEMP/web"
      - name: The signed builds, attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/attach_release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/assets"
